    <script>
      // Decide before first paint whether the title sequence plays, so the
      // opening never flashes its final state. Motion-reduced visitors, deep
      // links and restored scroll positions get the settled composition.
      (function () {
        var d = document.documentElement;
        d.classList.add("js");
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!reduce && !location.hash && window.scrollY < 10) {
          d.classList.add("intro");
          // Safety net: never leave the stage dark if the app fails to start.
          setTimeout(function () {
            if (!d.classList.contains("intro-started")) d.classList.remove("intro");
          }, 3500);
        }
      })();
    </script>
